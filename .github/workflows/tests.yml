name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The same gates as invisible_playwright's tests.yml, minus the two that belong
# to that repository alone (its guides and its version-is-taken test). `gate` is
# the ONLY context the branch protection requires: it depends on every job, so
# its name never drifts when the matrix changes, and it refuses on failure or
# cancellation but not on a skip, because `unit` is skipped on purpose while the
# pinned core is not on the index yet (core-on-index.yml says why).
jobs:
  english:
    name: the repository is English
    needs: core-on-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the pinned core, which carries the gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: check the prose
        run: |
          python -m invisible_core.english --selftest
          python -m invisible_core.english

  claims:
    name: the README promises nothing it cannot support
    needs: core-on-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the pinned core, which carries the gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: check the claims
        run: |
          python -m invisible_core.claims --selftest
          python -m invisible_core.claims

  # The way in is uv (the owner, 2026-09-06 and "uv everywhere" on 2026-10-17),
  # and on that day this repository still taught pip in its README, its
  # CONTRIBUTING, its docs and the messages its code prints, with nothing
  # comparing any of them with the decision. `invisible_core.way_in` since core
  # 49.45.0 refuses an install instruction that is not uv, in the tracked
  # Markdown, the issue templates and the string literals of src/.
  way-in:
    name: every install instruction is uv
    needs: core-on-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the pinned core, which carries the gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: check the way in
        # --selftest first: a check that has only ever printed "clean" may
        # have gone blind.
        run: |
          python -m invisible_core.way_in --selftest
          python -m invisible_core.way_in

  # The user-install job runs on the ledger pull request, its wait for the
  # index is scoped to it and bounded, and the test file it runs keeps out, in
  # a `_LEAKS`, every variable the pinned core's library reads ([B347], [B349],
  # core 50.48.0). `invisible_core.install_job` judges this tree.
  install-job:
    name: the user-install job runs on the ledger pull request
    needs: core-on-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the pinned core, which carries the gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: check the install job
        run: |
          python -m invisible_core.install_job --selftest
          python -m invisible_core.install_job

  core-on-index:
    uses: ./.github/workflows/core-on-index.yml

  unit:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every version `requires-python = ">=3.11"` promises, on ubuntu; Windows
        # on 3.12 only, as in invisible_playwright.
        python: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.13" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: arm the pre-push gates
        run: python scripts/install_hooks.py
      - name: undefined names and duplicate definitions
        run: python -m ruff check --select F821,F811,F601 --no-cache --output-format concise .
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail   # or tee would swallow pytest's exit code
          pytest tests/ -v --tb=short -rs | tee tests-report.txt
      # pytest's exit code cannot tell "everything passed" from "the marker
      # expression deselected everything". A tripwire, a little under the count.
      - name: Refuse a run in which the suite deselected itself
        shell: bash
        run: |
          # The floor was 180 until 0.3.0, when the Juggler client's own tests
          # left with the client for invisible-core, and test_juggler_actions.py
          # followed them. It was 63 until 0.3.6, when the browser module left
          # for invisible_core.juggler.instance with its 21 tests (the event
          # buffer, the session files, the context locale): 44 run here now.
          # Kept near 85% of that, so a selection that drops most of the
          # suite still fails.
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("tests-report.txt").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r"(\d+) passed", text)
          passed = int(m.group(1)) if m else 0
          if passed < 37:
              print(f"only {passed} test(s) ran (expected 37+) - the selection "
                    f"dropped most of the suite and the exit code cannot see it",
                    file=sys.stderr)
              sys.exit(1)
          print(f"{passed} tests ran")
          PY

  gate:
    needs: [core-on-index, unit, english, claims, way-in, install-job]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: refuse unless nothing failed
        run: |
          echo "core-on-index: ${{ needs.core-on-index.result }}"
          echo "unit:          ${{ needs.unit.result }}"
          echo "english:       ${{ needs.english.result }}"
          echo "claims:        ${{ needs.claims.result }}"
          echo "way-in:        ${{ needs.way-in.result }}"
          echo "install-job:   ${{ needs.install-job.result }}"
          case "${{ needs.unit.result }}" in
            failure|cancelled) echo "the suite did not pass"; exit 1 ;;
          esac
          case "${{ needs.core-on-index.result }}" in
            failure|cancelled) echo "the index check did not run"; exit 1 ;;
          esac
          case "${{ needs.english.result }}" in
            failure|cancelled) echo "the repository is not English"; exit 1 ;;
          esac
          case "${{ needs.claims.result }}" in
            failure|cancelled) echo "the README promises what no measurement supports"; exit 1 ;;
          esac
          case "${{ needs.way-in.result }}" in
            failure|cancelled) echo "an install instruction is not uv"; exit 1 ;;
          esac
          case "${{ needs.install-job.result }}" in
            failure|cancelled) echo "the user-install job would not run on a release, or leaks"; exit 1 ;;
          esac
          echo "ok"
